<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOJO HUB — Survive Deep in the Woods</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes shimmer{to{background-position:200% center}}
.jojo-title{animation:shimmer 6s linear infinite}
@keyframes ledBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.78)}}
@keyframes ledPing{0%{transform:scale(1);opacity:.65}75%,100%{transform:scale(2.8);opacity:0}}
.led-dot{animation:ledBlink 1.1s ease-in-out infinite}
.led-ping{animation:ledPing 1.6s cubic-bezier(0,0,.2,1) infinite}
.jojo-code{flex:1;min-height:0;overflow:auto;background:rgba(0,0,0,.55);border:1px solid rgba(139,92,246,.25);border-radius:10px;padding:10px 12px;color:#ede9fe;font-family:ui-monospace,'SF Mono','Cascadia Code','Courier New',monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.jojo-code::-webkit-scrollbar{width:6px}
.jojo-code::-webkit-scrollbar-thumb{background:rgba(139,92,246,.35);border-radius:3px}
.jojo-copybtn{display:flex;align-items:center;gap:6px;border:none;cursor:pointer;border-radius:8px;padding:6px 12px;font-family:'Mitr',sans-serif;font-weight:500;font-size:11.5px;letter-spacing:.03em;color:#fff;background:linear-gradient(135deg,#8b5cf6,#7c3aed);box-shadow:0 2px 10px rgba(124,58,237,.4);transition:transform .12s,filter .2s,background .3s;flex-shrink:0}
.jojo-copybtn:hover{filter:brightness(1.15)}
.jojo-copybtn:active{transform:scale(.95)}
.jojo-copybtn.success{background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 2px 10px rgba(16,185,129,.45)}
</style>
</head>

    <script>
    (function(){
      var btn = document.getElementById('jojoCopy');
      var btnText = document.getElementById('jojoCopyText');
      var code = document.getElementById('jojoScript');
      var timer = null;
      if(!btn || !btnText || !code) return;
      function revert(){
        btn.classList.remove('success');
        btnText.textContent = 'คัดลอก';
      }
      function done(){
        btn.classList.add('success');
        btnText.textContent = 'คัดลอกแล้ว';
        if(timer) clearTimeout(timer);
        timer = setTimeout(revert, 1800);
      }
      function fallback(){
        try{
          var ta = document.createElement('textarea');
          ta.value = code.textContent;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          done();
        }catch(e){
          btnText.textContent = 'ไม่สำเร็จ';
          if(timer) clearTimeout(timer);
          timer = setTimeout(revert, 1600);
        }
      }
      btn.addEventListener('click', function(){
        var text = code.textContent || '';
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(done).catch(fallback);
        } else {
          fallback();
        }
      });
    })();
    </script>
